# Runs the same gate as the CI, automatically, on every commit.
# Install once with: poetry run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # A local hook rather than mirrors-mypy: the mirror runs in its own isolated
  # environment, so it sees neither the project's dependencies nor its stubs, and
  # reports errors that `poe gate` and the CI do not. Two type checkers disagreeing
  # about the same code is a configuration bug, and the one that matters is the one
  # the CI runs. It checks src/ as a whole rather than only the staged files, because
  # a type error is usually about the relationship between two modules.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy src/
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # The split manifests are generated JSON holding participant ids from a public
        # dataset plus two configuration hashes. The hashes read as high-entropy hex
        # and trip the scanner every time a config changes. Excluding the one generated
        # path keeps the scanner meaningful everywhere a real secret could appear,
        # rather than training everyone to ignore its output.
        exclude: ^data/processed/splits/.*\.json$
