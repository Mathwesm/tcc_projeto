# Double the learning rate.
# 5e-5 came from a 70B model. Smaller models generally tolerate, and often need,
# more aggressive steps -- there are far fewer parameters absorbing each update.
#
# Only the fields below differ from configs/default.yaml. One variable per run:
# a table where two things moved at once cannot attribute the difference to either.

experiments:
  risky_choice:
    - peterson2021using
  categorization:
    - badham2017deficits
  reinforcement_learning:
    - kool2016when

data:
  max_choices_per_domain: 30000

training:
  learning_rate: 1.0e-4
