# Four times the learning rate. Expect this one to be worse; a run that
# overshoots is what proves the chosen rate was not simply the smallest tried.
#
# Only the fields below differ from configs/default.yaml. One variable per run:
# a table where two things moved at once cannot attribute the difference to either.

experiments:
  risky_choice:
    - peterson2021using
  categorization:
    - badham2017deficits
  reinforcement_learning:
    - kool2016when

data:
  max_choices_per_domain: 30000

training:
  learning_rate: 2.0e-4
